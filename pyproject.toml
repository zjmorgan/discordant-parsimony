[project]
name = "discordant-parsimony"
description = "Forward modeling of single-crystal diffuse scattering from pair correlations"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "PyCifRW",
]
license = { text = "GPL3.0" }

[project.optional-dependencies]
io = ["h5py"]
gpu = ["cupy"]
test = ["pytest", "h5py"]

[build-system]
requires = [
  "setuptools",
   "wheel",
   "toml",
   "versioningit"
]
build-backend = "setuptools.build_meta"

[tool.versioningit.vcs]
method = "git"
default-tag = "0.0.1"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}"
dirty = "{version}+d{build_date:%Y%m%d}"
distance-dirty = "{next_version}.dev{distance}+d{build_date:%Y%m%d%H%M}"

[tool.versioningit.write]
file = "src/discordant_parsimony/_version.py"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 79
target-version = ['py310', 'py311']
include = '\.pyi?$'
